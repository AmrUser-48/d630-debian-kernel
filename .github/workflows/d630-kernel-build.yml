name: D630 Debian Core 2 Kernel — Build, Audit & Release
run-name: "D630 Core 2 kernel / ${{ github.ref_name }} / #${{ github.run_number }}"

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - "config/d630-core2.config"
      - "scripts/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: d630-debian-core2-kernel
  cancel-in-progress: true

jobs:
  build_validate_publish:
    name: Build, validate & publish / amd64
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      BUILD_VARIANT: "amd64"
      SOURCE_VERSION: "6.1.180-1"
      BUILD_JOBS: "2"
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout source repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Initialize diagnostic log
        run: |
          set -Eeuo pipefail
          {
            echo "Workflow: $GITHUB_WORKFLOW"
            echo "Run ID: $GITHUB_RUN_ID / attempt $GITHUB_RUN_ATTEMPT"
            echo "Commit: $GITHUB_SHA"
            echo "Branch: $GITHUB_REF_NAME"
            echo "Build target: standard amd64"
            echo "Source package: linux=$SOURCE_VERSION"
            echo "Started at UTC: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          } > "build-$BUILD_VARIANT.log"

      - name: Lint workflow and build scripts
        run: |
          set -Eeuo pipefail
          exec > >(tee -a "build-$BUILD_VARIANT.log") 2>&1
          bash -n scripts/build-d630-kernel.sh
          bash -n scripts/verify-d630-kernel-build.sh
          python3 -m py_compile \
            scripts/d630_kconfig.py \
            scripts/apply-d630-policy.py \
            scripts/audit-d630.py \
            scripts/test-d630-kconfig.py
          python3 scripts/test-d630-kconfig.py
          curl --fail --location --retry 3 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" .github/workflows/d630-kernel-build.yml

      - name: Build Debian kernel package
        timeout-minutes: 330
        run: |
          set -Eeuo pipefail
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/work" \
            --workdir /work \
            --env BUILD_VARIANT \
            --env SOURCE_VERSION \
            --env BUILD_JOBS \
            debian:bookworm \
            bash -e -o pipefail -c 'bash scripts/build-d630-kernel.sh' \
            2>&1 | tee -a "build-$BUILD_VARIANT.log"

      - name: Verify package, configuration & checksums
        run: |
          set -Eeuo pipefail
          exec > >(tee -a "build-$BUILD_VARIANT.log") 2>&1
          bash scripts/verify-d630-kernel-build.sh "$BUILD_VARIANT"

      - name: Upload diagnostics on success or failure
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: d630-kernel-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build-amd64.log
            audit/amd64/
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0

      - name: Upload validated installable packages
        if: ${{ success() }}
        uses: actions/upload-artifact@v7
        with:
          name: d630-debian-core2-kernel-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/amd64/*
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Publish validated kernel to GitHub pre-release
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          DIST="$GITHUB_WORKSPACE/dist/$BUILD_VARIANT"
          TAG="d630-debian-6.1.180-core2-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          test -s "$DIST/RELEASE-NOTES.md"
          gh release create "$TAG" "$DIST"/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Debian 12 Core 2 kernel 6.1.180-d630-core2" \
            --notes-file "$DIST/RELEASE-NOTES.md" \
            --prerelease
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url,name,assets
