name: Build D630 Bookworm-backports kernel 6.12.95 (amd64)

on:
  push:
    branches: [main, d630-kernel-6.12.95-bookworm-backports]
    paths:
      - .github/workflows/build-d630-kernel-amd64.yml
      - .github/workflows/build-d630-kernel-amd64-rt.yml
      - config/d630-core2-6.12.95.config
      - scripts/build-d630-6.12.95.sh
      - scripts/apply-d630-6.12.95-policy.py
      - scripts/audit-d630-6.12.95.py
      - README.md
      - docs/**
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: d630-bookworm-backports-6.12.95-amd64
  cancel-in-progress: true

jobs:
  build:
    name: Build and verify normal amd64 kernel
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      BUILD_VARIANT: amd64
      SOURCE_VERSION: 6.12.95-1~bpo12+1
      BUILD_JOBS: 2
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Reclaim runner disk space
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /usr/share/swift /usr/lib/mono \
            /opt/hostedtoolcache/CodeQL
          docker system prune -af --volumes || true
          df -h "$GITHUB_WORKSPACE"

      - name: Lint shell and Python build scripts
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/build-d630-6.12.95.sh
          python3 -m py_compile \
            scripts/apply-d630-6.12.95-policy.py \
            scripts/audit-d630-6.12.95.py
          grep -q '6.12.95-1~bpo12+1' scripts/build-d630-6.12.95.sh
          grep -q 'binary-arch_amd64_none_amd64_image' scripts/build-d630-6.12.95.sh

      - name: Build using Debian's native Bookworm-backports source and image target
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/work" \
            --workdir /work \
            --env BUILD_VARIANT \
            --env SOURCE_VERSION \
            --env BUILD_JOBS \
            debian:bookworm \
            bash -e -o pipefail -c \
              'bash scripts/build-d630-6.12.95.sh 2>&1 | tee build-amd64.log'

      - name: Verify installable package, firmware and config audit
        shell: bash
        run: |
          set -euo pipefail
          DIST="$GITHUB_WORKSPACE/dist/amd64"
          PACKAGE="$DIST/linux-image-6.12.95+deb12-amd64_6.12.95-1~bpo12+1+d6301_amd64.deb"
          test -s "$PACKAGE"
          test -s "$DIST"/firmware-iwlwifi_*.deb
          test -s "$DIST"/intel-microcode_*.deb
          test -s "$DIST/SHA256SUMS"
          (cd "$DIST" && sha256sum -c SHA256SUMS)
          test "$(dpkg-deb -f "$PACKAGE" Package)" = linux-image-6.12.95+deb12-amd64
          test "$(dpkg-deb -f "$PACKAGE" Version)" = 6.12.95-1~bpo12+1+d6301
          test "$(dpkg-deb -f "$PACKAGE" Architecture)" = amd64
          grep -qx 'Kernel release: 6.12.95+deb12-amd64' "$DIST/BUILD-REPORT.txt"
          grep -qx '# CONFIG_PREEMPT_RT is not set' "$DIST/D630-FINAL-CONFIG"
          test -s "$GITHUB_WORKSPACE/audit/amd64/d630-config.diff"
          test -s "$GITHUB_WORKSPACE/audit/amd64/d630-config-symbol-audit.tsv"

      - name: Upload package, firmware, logs and audit (fail if any are missing)
        uses: actions/upload-artifact@v4
        with:
          name: d630-kernel-6.12.95-bookworm-backports-amd64
          path: |
            dist/amd64/*
            audit/amd64/*
            build-amd64.log
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Publish verified build to a unique pre-release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          DIST="$GITHUB_WORKSPACE/dist/amd64"
          TAG="d630-kernel-6.12.95-bookworm-backports-amd64-$GITHUB_RUN_ID"
          gh release create "$TAG" "$DIST"/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "D630 stripped Debian 12 Bookworm-backports kernel 6.12.95 (amd64)" \
            --notes-file "$DIST/RELEASE-NOTES.md" \
            --prerelease
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url,name,assets
