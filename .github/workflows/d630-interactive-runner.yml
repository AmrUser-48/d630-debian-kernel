name: D630 Interactive Build Runner
run-name: "D630 interactive / ${{ github.ref_name }} / #${{ github.run_number }}"

on:
  workflow_dispatch:
  # Also start the runner for the explicit repair commit; ordinary workflow edits do not launch it.
  push:
    branches: [main]
    paths:
      - .github/workflows/d630-interactive-runner.yml

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  interactive:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[start-d630-runner]')
    name: Interactive SSH / Ubuntu 24.04
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      DEBIAN_FRONTEND: noninteractive
      LANG: C.UTF-8
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate Desktop Commander device secret
        env:
          DESKTOP_COMMANDER_DEVICE_B64: ${{ secrets.DESKTOP_COMMANDER_DEVICE_B64 }}
        run: |
          set -Eeuo pipefail
          if [[ -z "$DESKTOP_COMMANDER_DEVICE_B64" ]]; then
            echo "::error::Add repository secret DESKTOP_COMMANDER_DEVICE_B64 before starting this runner."
            exit 1
          fi

      - name: Fetch Debian 12 user configurations
        run: |
          set -Eeuo pipefail
          git clone --depth=1 --single-branch --branch main \
            https://github.com/AmrUser-48/deb12dots.git "$RUNNER_TEMP/deb12dots"
          echo "Debian user configuration revision: $(git -C "$RUNNER_TEMP/deb12dots" rev-parse HEAD)"

      - name: Install build and interactive tools
        env:
          SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          set -Eeuo pipefail

          # SSH_PUBLIC_KEY remains optional; the built-in owner key is always installed below.
          if [[ -z "$TAILSCALE_AUTHKEY" ]]; then
            echo "::error::Repository secret TAILSCALE_AUTHKEY is required for Tailscale authentication."
            exit 1
          fi

          mapfile -t VIM_PACKAGES < <(
            dpkg-query -W -f='${db:Status-Abbrev} ${binary:Package}\n' 'vim*' 2>/dev/null |
              awk '$1 == "ii" && $2 ~ /^vim([.-]|$)/ { print $2 }'
          )
          if (("${#VIM_PACKAGES[@]}")); then
            sudo apt-get purge --yes "${VIM_PACKAGES[@]}"
          fi

          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            openssh-server mosh \
            git gh \
            neovim lf fd-find ripgrep fzf tmux htop jq tree bat less bash-completion \
            file unzip zip xdg-utils libfile-mimeinfo-perl \
            build-essential bc bison flex \
            libssl-dev libelf-dev libncurses-dev dwarves \
            rsync cpio kmod fakeroot dpkg-dev quilt debhelper \
            python3 python3-dev python3-ply python3-setuptools \
            curl ca-certificates xz-utils zstd lz4 \
            intel-microcode iucode-tool

          mapfile -t REMAINING_VIM_PACKAGES < <(
            dpkg-query -W -f='${db:Status-Abbrev} ${binary:Package}\n' 'vim*' 2>/dev/null |
              awk '$1 == "ii" && $2 ~ /^vim([.-]|$)/ { print $2 }'
          )
          if (("${#REMAINING_VIM_PACKAGES[@]}")); then
            printf '::error::Vim packages remain installed: %s\n' "${REMAINING_VIM_PACKAGES[*]}"
            exit 1
          fi
          command -v nvim
          command -v lf
          command -v fdfind
          command -v git
          command -v gh
          command -v mosh-server

          sudo mkdir -p /lib/firmware /lib/firmware/intel-ucode

          # Fetch only the legacy Intel 3945 firmware needed by the D630.
          # Avoid installing the 112 MB linux-firmware-intel-wireless package.
          WIFI_URL='https://kernel.googlesource.com/pub/scm/linux/kernel/git/firmware/linux-firmware/+/refs/heads/main/intel/iwlwifi/iwlwifi-3945-2.ucode?format=TEXT'
          WIFI_B64="$RUNNER_TEMP/iwlwifi-3945-2.ucode.b64"
          WIFI_TMP="$RUNNER_TEMP/iwlwifi-3945-2.ucode"
          WIFI_TARGET=/lib/firmware/iwlwifi-3945-2.ucode

          curl --fail --location --silent --show-error \
            --retry 3 --retry-all-errors --connect-timeout 15 --max-time 120 \
            "$WIFI_URL" -o "$WIFI_B64"
          base64 --decode "$WIFI_B64" > "$WIFI_TMP"
          test -s "$WIFI_TMP"
          sudo install -m 0644 "$WIFI_TMP" "$WIFI_TARGET"
          rm -f "$WIFI_B64" "$WIFI_TMP"

          echo "Intel 3945 firmware installed:"
          stat -c '%n: %s bytes' "$WIFI_TARGET"
          sha256sum "$WIFI_TARGET"

          # intel-microcode already installs this exact file under /usr/lib;
          # /lib is the same firmware tree on Ubuntu. Validate it in place.
          MICROCODE=/lib/firmware/intel-ucode/06-0f-0d
          test -s "$MICROCODE" || {
            echo "::error::T7250 microcode 06-0f-0d is missing."
            dpkg -L intel-microcode 2>/dev/null | grep -F '/06-0f-0d' || true
            exit 1
          }
          iucode_tool -l "$MICROCODE" | tee "$RUNNER_TEMP/d630-microcode.txt"
          grep -qiE '0x0*6fd' "$RUNNER_TEMP/d630-microcode.txt" || {
            echo "::error::Microcode does not contain the T7250 CPUID signature 0x000006fd."
            exit 1
          }

          DOTFILES="$RUNNER_TEMP/deb12dots"
          for config in \
            .bashrc .aaliases .inputrc \
            .config/nvim/init.lua \
            .config/lf/lfrc .config/lf/icons .config/lf/colors \
            .config/bat/config \
            bash-command-timer/bash_command_timer.sh; do
            [[ -s "$DOTFILES/$config" ]] || {
              echo "::error::Required user configuration is missing: $config"
              exit 1
            }
          done

          install -d -m 0700 "$HOME/.ssh"
          install -d -m 0755 "$HOME/.local/bin" "$HOME/.config/d630-runner" \
            "$HOME/.local/lib/bash-command-timer" "$HOME/.trash"
          : > "$RUNNER_TEMP/authorized_keys"
          if [[ -n "$SSH_PUBLIC_KEY" ]]; then
            printf '%s\n' "$SSH_PUBLIC_KEY" >> "$RUNNER_TEMP/authorized_keys"
          fi
          cat >> "$RUNNER_TEMP/authorized_keys" <<'D630_DEFAULT_SSH_KEY'
          ssh-rsa  jeroen@dell
          D630_DEFAULT_SSH_KEY
          awk 'NF && !seen[$0]++' "$RUNNER_TEMP/authorized_keys" > "$RUNNER_TEMP/authorized_keys.dedup"
          ssh-keygen -lf "$RUNNER_TEMP/authorized_keys.dedup" >/dev/null
          install -m 0600 "$RUNNER_TEMP/authorized_keys.dedup" "$HOME/.ssh/authorized_keys"
          chown -R "$(id -un):$(id -gn)" "$HOME/.ssh"

          # Deploy the Debian 12 shell, lf, bat, and complete vendored Neovim config.
          cp "$DOTFILES/.bashrc" "$HOME/.bashrc"
          cp "$DOTFILES/.aaliases" "$HOME/.aaliases"
          cp "$DOTFILES/.inputrc" "$HOME/.inputrc"
          cp -a "$DOTFILES/.config/nvim" "$HOME/.config/"
          cp -a "$DOTFILES/.config/lf" "$HOME/.config/"
          cp -a "$DOTFILES/.config/bat" "$HOME/.config/"
          cp "$DOTFILES/bash-command-timer/bash_command_timer.sh" \
            "$HOME/.local/lib/bash-command-timer/bash_command_timer.sh"

          # Correct two typos in the runner copy without changing deb12dots.
          sed -i \
            -e '/^set prewiew!$/d' \
            -e 's|\$HOME\.config/lf/lfrc|$HOME/.config/lf/lfrc|' \
            "$HOME/.config/lf/lfrc"

          ln -sf "$(command -v fdfind)" "$HOME/.local/bin/fd"
          ln -sf "$(command -v batcat)" "$HOME/.local/bin/bat"

          printf 'export D630_WORKSPACE=%q\n' "$GITHUB_WORKSPACE" \
            > "$HOME/.config/d630-runner/env"
          cat >> "$HOME/.config/d630-runner/env" <<'EOF'
          export XDG_CONFIG_HOME="${XDG_CONFIG_HOME:-$HOME/.config}"
          export PATH="$HOME/.local/bin:$PATH"
          export OPENER="${OPENER:-xdg-open}"
          export ARCH=x86_64
          export KCFLAGS="${KCFLAGS:--march=core2 -mtune=core2}"
          export BUILD_JOBS="${BUILD_JOBS:-$(nproc)}"
          export MAKEFLAGS="${MAKEFLAGS:--j$BUILD_JOBS}"
          [[ -r "$HOME/.config/lf/icons" ]] && source "$HOME/.config/lf/icons"
          . /usr/share/bash-completion/bash_completion
          EOF
          chmod 0600 "$HOME/.config/d630-runner/env"

          cat >> "$HOME/.bashrc" <<'EOF'

          # D630 hosted-runner environment.
          [[ -r "$HOME/.config/d630-runner/env" ]] && source "$HOME/.config/d630-runner/env"
          EOF

          bash -n "$HOME/.bashrc"
          bash -n "$HOME/.aaliases"
          bash -n "$HOME/.local/lib/bash-command-timer/bash_command_timer.sh"
          nvim --headless -u "$HOME/.config/nvim/init.lua" +qa

      - name: Configure GitHub CLI and Git with repository administration token
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          set -Eeuo pipefail
          if [[ -z "$GH_PAT" ]]; then
            echo "::error::Repository secret GH_PAT is required. Create a fine-grained PAT with access to the repositories the runner must manage."
            exit 1
          fi

          # Keep the token readable only by the runner account.
          install -d -m 0700 "$HOME/.config/d630-runner"
          umask 077
          printf '%s' "$GH_PAT" > "$HOME/.config/d630-runner/gh-token"
          chmod 0600 "$HOME/.config/d630-runner/gh-token"

          # Fine-grained PATs are supplied to gh through GH_TOKEN.
          export GH_TOKEN="$GH_PAT"
          gh auth setup-git --hostname github.com
          git config --global init.defaultBranch main
          git config --global fetch.prune true
          git config --global pull.ff only
          git config --global core.pager 'less -FRX'
          git config --global user.name "$GITHUB_ACTOR"
          git config --global user.email "${GITHUB_ACTOR_ID}+${GITHUB_ACTOR}@users.noreply.github.com"

          # Make gh and Git use this token in later SSH login shells.
          cat >> "$HOME/.bashrc" <<'EOF'
          if [[ -r "$HOME/.config/d630-runner/gh-token" ]]; then
            export GH_TOKEN="$(<"$HOME/.config/d630-runner/gh-token")"
          fi
          EOF

          # MCP stdio requires clean stdout. The deployed .bashrc must stay silent
          # when sourced by a non-interactive SSH remote command.
          STARTUP_STDOUT="$(bash --noprofile -c 'source "$HOME/.bashrc"; printf "__D630_CLEAN_STDOUT__"')"
          if [[ "$STARTUP_STDOUT" != "__D630_CLEAN_STDOUT__" ]]; then
            echo "::error::Non-interactive Bash startup polluted stdout; refusing to publish the runner."
            printf '%s\n' "$STARTUP_STDOUT" >&2
            exit 1
          fi
          echo "Non-interactive SSH shell startup is stdout-clean (MCP JSON-RPC safe)."

          gh auth status
          git --version
          gh --version

      - name: Restore Gemini and Agy credentials
        env:
          GEMINI_CONFIG_B64: ${{ secrets.GEMINI_CONFIG_B64 }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -Eeuo pipefail
          umask 077

          if [[ -n "$GEMINI_CONFIG_B64" ]]; then
            printf '%s' "$GEMINI_CONFIG_B64" |
              base64 --decode |
              tar -xz --no-same-owner -C "$HOME"

            for config_dir in "$HOME/.gemini" "$HOME/.config/agy-open"; do
              if [[ ! -d "$config_dir" ]]; then
                echo "::error::GEMINI_CONFIG_B64 must contain both .gemini/ and .config/agy-open/."
                exit 1
              fi
              chmod -R go-rwx "$config_dir"
              echo "Restored $config_dir"
            done
          else
            echo "::notice::GEMINI_CONFIG_B64 is not set; Gemini and Agy configuration was not restored."
          fi

          if [[ -n "$GEMINI_API_KEY" ]]; then
            install -d -m 0700 "$HOME/.config/d630-runner"
            printf '%s' "$GEMINI_API_KEY" > "$HOME/.config/d630-runner/gemini-api-key"
            printf 'GEMINI_API_KEY=%s\n' "$GEMINI_API_KEY" > "$HOME/.config/d630-runner/gemini-api.env"
            chmod 0600 "$HOME/.config/d630-runner/gemini-api-key" "$HOME/.config/d630-runner/gemini-api.env"

            if ! grep -Fq '# D630 Gemini API key' "$HOME/.bashrc"; then
              cat >> "$HOME/.bashrc" <<'D630_GEMINI_ENV'

          # D630 Gemini API key.
          if [[ -r "$HOME/.config/d630-runner/gemini-api-key" ]]; then
            export GEMINI_API_KEY="$(<"$HOME/.config/d630-runner/gemini-api-key")"
          fi
          D630_GEMINI_ENV
            fi

            printf 'GEMINI_API_KEY=%s\n' "$GEMINI_API_KEY" >> "$GITHUB_ENV"
            echo "Gemini API key installed for subsequent workflow steps and SSH Bash sessions."
          else
            echo "::notice::GEMINI_API_KEY is not set; Gemini API-key authentication is unavailable."
          fi

      - name: Install GitHub and Git MCP servers for Agy
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          set -Eeuo pipefail
          bash scripts/install-agy-mcp-servers.sh

      - name: Join Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          hostname: d630-runner-${{ github.run_id }}
          use-cache: "true"

      - name: Set up Node.js for Desktop Commander Remote
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install and start Desktop Commander Remote MCP
        env:
          DESKTOP_COMMANDER_DEVICE_B64: ${{ secrets.DESKTOP_COMMANDER_DEVICE_B64 }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -Eeuo pipefail

          if [[ -z "$DESKTOP_COMMANDER_DEVICE_B64" ]]; then
            echo "::error::Repository secret DESKTOP_COMMANDER_DEVICE_B64 is required."
            exit 1
          fi
          if [[ -z "$GH_TOKEN" ]]; then
            echo "::error::Repository secret GH_PAT is required."
            exit 1
          fi

          node --version
          npm --version
          node -e '
            const [major, minor] = process.versions.node.split(".").map(Number);
            if (major < 22 || (major === 22 && minor < 12)) {
              console.error("Desktop Commander Remote requires Node.js 22.12 or newer.");
              process.exit(1);
            }
          '

          # Restore only the device session and MQTT credentials; never restore local logs.
          printf '%s' "$DESKTOP_COMMANDER_DEVICE_B64" |
            base64 --decode |
            tar -xz -C "$HOME"

          DC_DIR="$HOME/.desktop-commander-device"
          test -s "$DC_DIR/device.json"
          test -s "$DC_DIR/.mqtt/identity.json"
          test -s "$DC_DIR/.mqtt/certificate.json"
          chmod 0700 "$DC_DIR" "$DC_DIR/.mqtt"
          chmod 0600 "$DC_DIR/device.json" "$DC_DIR/.mqtt/identity.json" "$DC_DIR/.mqtt/certificate.json"

          # Install the current published Remote Device package for this runner session.
          npm install --global --prefix "$HOME/.local" @wonderwhy-er/desktop-commander@latest
          test -x "$HOME/.local/bin/desktop-commander"

          # Keep the Remote Device connected for the lifetime of this interactive runner.
          nohup "$HOME/.local/bin/desktop-commander" remote \
            >>"$RUNNER_TEMP/desktop-commander-remote.log" 2>&1 </dev/null &
          REMOTE_PID=$!
          printf '%s\n' "$REMOTE_PID" > "$RUNNER_TEMP/desktop-commander-remote.pid"
          sleep 3
          if ! kill -0 "$REMOTE_PID" 2>/dev/null; then
            echo "::error::Desktop Commander Remote exited during startup; inspect the runner's remote log."
            exit 1
          fi
          echo "Desktop Commander Remote started (PID $REMOTE_PID)."
          echo "Device credentials restored from DESKTOP_COMMANDER_DEVICE_B64."

      - name: Install workspace snapshots and shutdown upload
        run: |
          set -Eeuo pipefail

          cat > "$RUNNER_TEMP/d630-runner-snapshot.env" <<EOF
          D630_WORKSPACE=$GITHUB_WORKSPACE
          D630_REPOSITORY=$GITHUB_REPOSITORY
          D630_RUN_ID=$GITHUB_RUN_ID
          D630_SHA=$GITHUB_SHA
          D630_TAG=d630-runner-$GITHUB_RUN_ID
          D630_TMPDIR=$RUNNER_TEMP
          EOF
          sudo install -m 0600 -o runner -g runner "$RUNNER_TEMP/d630-runner-snapshot.env" /etc/default/d630-runner-snapshot

          sudo tee /usr/local/sbin/d630-save-workspace >/dev/null <<'D630_SNAPSHOT_SCRIPT'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          export HOME=/home/runner
          source /etc/default/d630-runner-snapshot
          TOKEN_FILE="$HOME/.config/d630-runner/gh-token"
          [[ -s "$TOKEN_FILE" ]] || { echo "Missing GitHub release token: $TOKEN_FILE" >&2; exit 1; }
          export GH_TOKEN="$(<"$TOKEN_FILE")"

          mkdir -p "$D630_TMPDIR"
          STAMP="$(date -u +%Y%m%dT%H%M%SZ)"
          ARCHIVE="$D630_TMPDIR/d630-workspace-$STAMP-${BASHPID}.tar.zst"
          echo "Snapshotting workspace: $D630_WORKSPACE"
          tar --zstd -cf "$ARCHIVE" \
            --exclude='./.git' --exclude='./.git/**' --exclude='*/.git' --exclude='*/.git/**' \
            --exclude='./.ssh' --exclude='./.ssh/**' --exclude='*/.ssh' --exclude='*/.ssh/**' \
            --exclude='./.env' --exclude='./.env.*' --exclude='*/.env' --exclude='*/.env.*' \
            --exclude='*.pem' --exclude='*.p12' \
            -C "$D630_WORKSPACE" .
          ls -lh "$ARCHIVE"

          if ! gh release view "$D630_TAG" --repo "$D630_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$D630_TAG" --repo "$D630_REPOSITORY" \
              --title "D630 interactive runner #$D630_RUN_ID snapshots" \
              --notes "Automatic workspace snapshots. Extract over a fresh checkout of the same repository." \
              --prerelease --target "$D630_SHA"
          fi
          gh release upload "$D630_TAG" "$ARCHIVE" --repo "$D630_REPOSITORY"
          rm -f "$ARCHIVE"
          echo "Workspace snapshot uploaded to release $D630_TAG."
          D630_SNAPSHOT_SCRIPT
          sudo chmod 0755 /usr/local/sbin/d630-save-workspace

          sudo tee /etc/systemd/system/d630-runner-shutdown-snapshot.service >/dev/null <<'D630_SHUTDOWN_UNIT'
          [Unit]
          Description=Upload D630 workspace before graceful shutdown
          Wants=network-online.target
          After=network-online.target

          [Service]
          Type=oneshot
          User=runner
          Environment=HOME=/home/runner
          EnvironmentFile=/etc/default/d630-runner-snapshot
          ExecStart=/bin/true
          ExecStop=/usr/local/sbin/d630-save-workspace
          RemainAfterExit=yes
          TimeoutStopSec=240

          [Install]
          WantedBy=multi-user.target
          D630_SHUTDOWN_UNIT

          sudo tee /etc/systemd/system/d630-runner-checkpoint.service >/dev/null <<'D630_CHECKPOINT_UNIT'
          [Unit]
          Description=Upload periodic D630 workspace checkpoint
          Wants=network-online.target
          After=network-online.target

          [Service]
          Type=oneshot
          User=runner
          Environment=HOME=/home/runner
          EnvironmentFile=/etc/default/d630-runner-snapshot
          ExecStart=/usr/local/sbin/d630-save-workspace
          TimeoutStartSec=240
          D630_CHECKPOINT_UNIT

          sudo tee /etc/systemd/system/d630-runner-checkpoint.timer >/dev/null <<'D630_CHECKPOINT_TIMER'
          [Unit]
          Description=Periodic D630 workspace checkpoint

          [Timer]
          OnBootSec=15min
          OnUnitActiveSec=30min
          AccuracySec=1min
          Unit=d630-runner-checkpoint.service

          [Install]
          WantedBy=timers.target
          D630_CHECKPOINT_TIMER

          sudo systemctl daemon-reload
          sudo systemctl enable --now d630-runner-shutdown-snapshot.service
          sudo systemctl enable --now d630-runner-checkpoint.timer
          echo "Graceful-shutdown snapshot hook enabled."
          echo "Automatic GitHub Release checkpoints: first at 15 minutes, then every 30 minutes."
          echo "Manual snapshot command: sudo -u runner /usr/local/sbin/d630-save-workspace"

      - name: Start supervised SSH and publish Mosh access on Tailscale
        run: |
          set -Eeuo pipefail

          sudo tailscale set --hostname="d630-runner-${GITHUB_RUN_ID}"
          TAILSCALE_IP="$(tailscale ip -4)"
          [[ "$TAILSCALE_IP" =~ ^100\. ]] || {
            echo "::error::Tailscale did not return a 100.x IPv4 address."
            exit 1
          }

          sudo install -d -m 0755 /etc/ssh/sshd_config.d
          sudo tee /etc/ssh/sshd_config.d/60-d630-interactive.conf >/dev/null <<EOF
          Port 22
          ListenAddress $TAILSCALE_IP
          PubkeyAuthentication yes
          AuthenticationMethods publickey
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          PermitRootLogin no
          AllowUsers runner
          PermitTTY yes
          AllowTcpForwarding yes
          X11Forwarding no
          PermitTunnel no
          Compression no
          PermitUserRC no
          PrintMotd no
          PrintLastLog no
          Banner none
          TCPKeepAlive yes
          ClientAliveInterval 30
          ClientAliveCountMax 6
          MaxSessions 12
          EOF

          # Ubuntu's pam_motd can write MOTD text to SSH session stdout even
          # when sshd PrintMotd is disabled. That corrupts MCP JSON-RPC streams.
          sudo sed -i -E '/^[[:space:]]*[^#].*pam_motd\.so/s/^/# D630 MCP stdio: disabled PAM MOTD: /' /etc/pam.d/sshd
          if grep -Eq '^[[:space:]]*[^#].*pam_motd\.so' /etc/pam.d/sshd; then
            echo "::error::An active pam_motd hook remains in /etc/pam.d/sshd."
            exit 1
          fi
          touch "$HOME/.hushlogin"

          sudo ssh-keygen -A

          # Disable the hosted image's socket/service so only the Tailscale-bound
          # D630 SSH service owns port 22.
          sudo systemctl disable --now ssh.socket ssh.service 2>/dev/null || true
          sudo pkill -x sshd 2>/dev/null || true
          sleep 1
          sudo rm -f /run/sshd.pid
          if pgrep -x sshd >/dev/null; then
            echo "::error::A previous sshd process is still running."
            pgrep -a -x sshd || true
            exit 1
          fi

          # Keep sshd outside the Actions step process tree. Mosh uses SSH to
          # launch a per-session mosh-server, then carries the terminal over UDP.
          sudo tee /etc/systemd/system/d630-sshd.service >/dev/null <<'D630_SSHD_UNIT'
          [Unit]
          Description=D630 Tailscale SSH transport for Mosh and fallback access
          Wants=network-online.target tailscaled.service
          After=network-online.target tailscaled.service
          StartLimitIntervalSec=0

          [Service]
          Type=simple
          RuntimeDirectory=sshd
          RuntimeDirectoryMode=0755
          ExecStartPre=/usr/sbin/sshd -t
          ExecStart=/usr/sbin/sshd -D -e
          Restart=always
          RestartSec=2s
          KillSignal=SIGTERM
          TimeoutStopSec=10

          [Install]
          WantedBy=multi-user.target
          D630_SSHD_UNIT

          sudo systemctl daemon-reload
          if ! sudo systemctl enable --now d630-sshd.service; then
            echo "::error::Could not start the supervised D630 SSH service."
            sudo journalctl -u d630-sshd.service -n 80 --no-pager || true
            exit 1
          fi

          for attempt in {1..15}; do
            if sudo systemctl is-active --quiet d630-sshd.service &&
               sudo ss -H -ltnp 'sport = :22' | grep -Fq "$TAILSCALE_IP:22"; then
              break
            fi
            sleep 1
          done

          LISTENERS="$(sudo ss -H -ltnp 'sport = :22' || true)"
          printf '%s\n' "$LISTENERS"
          if ! sudo systemctl is-active --quiet d630-sshd.service ||
             ! grep -Fq "$TAILSCALE_IP:22" <<<"$LISTENERS"; then
            echo "::error::The supervised SSH daemon did not bind to $TAILSCALE_IP:22."
            sudo systemctl status d630-sshd.service --no-pager || true
            sudo journalctl -u d630-sshd.service -n 80 --no-pager || true
            pgrep -a -x sshd || true
            exit 1
          fi

          MOSH_SERVER="$(command -v mosh-server || true)"
          [[ -x "$MOSH_SERVER" ]] || {
            echo "::error::mosh-server is not installed or executable."
            exit 1
          }
          timeout 3 bash -c ":</dev/tcp/$TAILSCALE_IP/22"

          echo
          echo "D630 INTERACTIVE RUNNER READY"
          echo "Workspace: $GITHUB_WORKSPACE"
          echo "Tailscale hostname: d630-runner-${GITHUB_RUN_ID}"
          echo "Tailscale IPv4: $TAILSCALE_IP"
          echo "Mosh server: $MOSH_SERVER (one process per Mosh session; UDP ports 60000-61000)"
          echo "Mosh PRIMARY: mosh --ssh='ssh -o ServerAliveInterval=20 -o ServerAliveCountMax=3' runner@$TAILSCALE_IP"
          echo "SSH FALLBACK: ssh -o ServerAliveInterval=20 -o ServerAliveCountMax=3 runner@$TAILSCALE_IP"
          echo "Supervised SSH service: d630-sshd.service"
          echo "SSH host key fingerprint:"
          sudo ssh-keygen -lf /etc/ssh/ssh_host_ed25519_key.pub
          echo
          echo "Build CPUs: $(nproc)"
          echo "Memory:"
          free -h
          echo "Disk:"
          df -h "$GITHUB_WORKSPACE"

      - name: Start Agy browser UI on private Tailscale HTTPS
        run: |
          set -Eeuo pipefail

          ENV_DIR="$HOME/.config/d630-runner"
          WEB_ENV="$ENV_DIR/agy-web.env"
          {
            if [[ -s "$ENV_DIR/gh-token" ]]; then
              printf 'GH_TOKEN=%s\n' "$(<"$ENV_DIR/gh-token")"
            fi
            if [[ -s "$ENV_DIR/gemini-api-key" ]]; then
              printf 'GEMINI_API_KEY=%s\n' "$(<"$ENV_DIR/gemini-api-key")"
            fi
          } > "$WEB_ENV"
          chmod 0600 "$WEB_ENV"

          sudo tee /etc/systemd/system/d630-agy-web.service >/dev/null <<EOF
          [Unit]
          Description=Agy browser UI
          Wants=network-online.target tailscaled.service
          After=network-online.target tailscaled.service

          [Service]
          Type=simple
          User=runner
          Group=runner
          Environment=HOME=/home/runner
          Environment=PATH=/home/runner/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          EnvironmentFile=-/home/runner/.config/d630-runner/agy-web.env
          WorkingDirectory=$GITHUB_WORKSPACE
          ExecStart=/usr/bin/agy serve 8080
          Restart=always
          RestartSec=2
          KillSignal=SIGTERM
          TimeoutStopSec=15

          [Install]
          WantedBy=multi-user.target
          EOF

          sudo systemctl daemon-reload
          sudo systemctl enable --now d630-agy-web.service

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/ -o /dev/null; then
              break
            fi
            if ! sudo systemctl is-active --quiet d630-agy-web.service; then
              sudo journalctl -u d630-agy-web.service -n 80 --no-pager || true
              echo "::error::Agy web UI failed to start."
              exit 1
            fi
            sleep 1
          done

          curl --fail --silent http://127.0.0.1:8080/ -o /dev/null || {
            sudo journalctl -u d630-agy-web.service -n 80 --no-pager || true
            echo "::error::Agy web UI did not answer on 127.0.0.1:8080."
            exit 1
          }

          # Serve is private to this Tailscale network; do not use Funnel.
          sudo tailscale serve --bg 8080
          sudo tailscale serve status

          TAILSCALE_DNS="$(sudo tailscale status --json | jq -r '.Self.DNSName // empty' | sed 's/\.$//')"
          if [[ -n "$TAILSCALE_DNS" ]]; then
            echo "AGY browser UI: https://$TAILSCALE_DNS/"
          else
            echo "AGY browser UI is published through Tailscale Serve; use the HTTPS URL printed above."
          fi

      - name: Keep interactive runner until 10-minute artifact reserve
        run: |
          set -Eeuo pipefail

          TOKEN_FILE="$HOME/.config/d630-runner/gh-token"
          [[ -s "$TOKEN_FILE" ]] || {
            echo "::error::Missing GH_PAT for reading the Actions job start time."
            exit 1
          }
          export GH_TOKEN="$(<"$TOKEN_FILE")"

          JOB_STARTED_AT="$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" \
            --jq '[.jobs[] | select(.status == "in_progress") | .started_at][0] // empty')"
          if [[ -z "$JOB_STARTED_AT" ]]; then
            JOB_STARTED_AT="$(gh api \
              "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
              --jq '.run_started_at // empty')"
          fi
          [[ -n "$JOB_STARTED_AT" ]] || {
            echo "::error::Could not determine the Actions job start time."
            exit 1
          }

          JOB_STARTED_EPOCH="$(date -u -d "$JOB_STARTED_AT" +%s)"
          DEADLINE_EPOCH=$((JOB_STARTED_EPOCH + 350 * 60))
          NOW_EPOCH="$(date -u +%s)"
          REMAINING_SECONDS=$((DEADLINE_EPOCH - NOW_EPOCH))

          if (( REMAINING_SECONDS > 0 )); then
            printf 'Runner deadline: %s UTC (job start + 350 minutes).\n' \
              "$(date -u -d "@$DEADLINE_EPOCH" '+%Y-%m-%d %H:%M:%S')"
            printf 'Remaining interactive time: %s seconds. Final 10 minutes reserved for artifact upload.\n' \
              "$REMAINING_SECONDS"
            sleep "$REMAINING_SECONDS"
          else
            echo "::warning::The 350-minute runner deadline has already passed; proceeding to artifact upload."
          fi

      - name: Upload final workspace artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d630-runner-workspace-${{ github.run_id }}
          path: |
            ${{ github.workspace }}/
            !${{ github.workspace }}/.git/**
            !${{ github.workspace }}/**/.git/**
            !${{ github.workspace }}/.ssh/**
            !${{ github.workspace }}/**/.ssh/**
            !${{ github.workspace }}/.env
            !${{ github.workspace }}/.env.*
            !${{ github.workspace }}/**/.env
            !${{ github.workspace }}/**/.env.*
            !${{ github.workspace }}/**/*.pem
            !${{ github.workspace }}/**/*.p12
          include-hidden-files: true
          compression-level: 0
          retention-days: 14
          if-no-files-found: warn
